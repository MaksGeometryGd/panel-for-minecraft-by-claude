# Положи в репозиторий как .github/workflows/build.yml рядом с mgg_panel.cpp (в корне репозитория).
# Запуск: вкладка Actions -> Build MGG panel -> Run workflow. Готовая libmggpanel.so будет в Artifacts.
name: Build MGG panel
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build armeabi-v7a
        run: |
          NDK=${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}
          CXX=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi21-clang++
          $CXX -std=c++17 -O2 -shared -fPIC -static-libstdc++ \
            -DMGG_TOKEN='"поменяй_меня"' \
            -o libmggpanel.so mgg_panel.cpp -llog
          file libmggpanel.so || true
      - uses: actions/upload-artifact@v4
        with:
          name: libmggpanel
          path: libmggpanel.so
