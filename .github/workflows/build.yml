# Положи в репозиторий как .github/workflows/build.yml
# Рядом в корне репозитория должны лежать: mgg_panel.cpp и папка mgg/ с файлом Overlay.java
# Запуск: Actions -> Build MGG panel -> Run workflow. Результат в Artifacts: libmggpanel.so и mgg_overlay.dex
name: Build MGG panel
on: [workflow_dispatch, push]
env:
  MGG_TOKEN: 1488     # ТОЛЬКО латиница и цифры, например mgg7391
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build native lib (armeabi-v7a)
        run: |
          NDK=${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}
          CXX=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi21-clang++
          $CXX -std=c++17 -O2 -shared -fPIC -static-libstdc++ \
            -DMGG_TOKEN="\"$MGG_TOKEN\"" \
            -o libmggpanel.so mgg_panel.cpp -llog
          file libmggpanel.so || true

      - name: Build overlay dex
        run: |
          SDK=${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}
          JAR=$(ls -d $SDK/platforms/android-*/android.jar | sort -V | tail -1)
          BT=$(ls -d $SDK/build-tools/* | sort -V | tail -1)
          echo "android.jar: $JAR"; echo "build-tools: $BT"
          sed -i "s/__MGG_TOKEN__/$MGG_TOKEN/" mgg/Overlay.java
          mkdir -p cls out
          javac --release 8 -cp "$JAR" -d cls mgg/Overlay.java
          "$BT/d8" --lib "$JAR" --min-api 21 --output out $(find cls -name '*.class')
          cp out/classes.dex mgg_overlay.dex
          ls -l mgg_overlay.dex

      - uses: actions/upload-artifact@v4
        with:
          name: mgg
          path: |
            libmggpanel.so
            mgg_overlay.dex
            
