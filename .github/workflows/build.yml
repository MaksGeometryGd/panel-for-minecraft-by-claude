# Положи как .github/workflows/build.yml. Рядом в репозитории: mgg_panel.cpp (корень), mgg/Overlay.java, mgg/Loader.java.
# Каждый пуш собирает: libmggpanel.so (панель), overlay.jar (окно поверх игры), loader.dex (ставится в APK один раз)
# и выкладывает их в релиз "latest" с постоянными ссылками. Загрузчик в игре сам скачивает свежую сборку.
# Токен панели: Settings -> Secrets and variables -> Actions -> New secret -> MGG_TOKEN (буквы, цифры, _ и -). Нет секрета: токен "mgg".
name: Build MGG panel
on: [workflow_dispatch, push]
permissions:
  contents: write
concurrency:
  group: mgg-release
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        env:
          MGG_TOKEN: ${{ secrets.MGG_TOKEN }}
        run: |
          set -e
          TOKEN="${MGG_TOKEN:-mgg}"
          [[ "$TOKEN" =~ ^[A-Za-z0-9_-]+$ ]] || { echo "MGG_TOKEN: только буквы, цифры, _ и -"; exit 1; }

          # 0) Dobby (хуки). Его последняя версия не собирается под 32-бит, поэтому идём назад по истории
          #    (на 1, 10, 30... коммитов назад) и берём первую версию, которая собралась
          NDK=${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}
          git clone https://github.com/jmpews/Dobby.git
          MAIN=$(git -C Dobby rev-parse HEAD)
          echo "=== Dobby: коммитов в истории: $(git -C Dobby rev-list --count "$MAIN"), теги: $(git -C Dobby tag | tail -n 5 | tr '\n' ' ')"
          DOBBY_LIBS=""
          # Ошибка "write to reserved register 'R7'": в Thumb-режиме clang держит r7 как frame pointer, а Dobby
          # (cpu.cc, cacheflush через svc) пишет в r7. Лечим двумя способами:
          #   вариант A — собираем Dobby в ARM-режиме (там frame pointer = r11) и без frame pointer;
          #   вариант B — A + правим исходник: asm-вызов cacheflush заменяется на __builtin___clear_cache.
          patch_r7() {
            python3 - <<'PY'
          import re, pathlib
          for f in pathlib.Path("Dobby").rglob("*.cc"):
              t = f.read_text(errors="ignore")
              if not re.search(r'asm\s*\(\s*"r7"\s*\)', t): continue
              lines = t.split("\n")
              k = next(i for i, l in enumerate(lines) if re.search(r'asm\s*\(\s*"r7"\s*\)', l))
              st = k
              while st > 0 and not re.match(r'^[A-Za-z_].*\)\s*\{?\s*$', lines[st]): st -= 1   # заголовок функции
              depth, en, seen = 0, st, False
              for i in range(st, len(lines)):
                  depth += lines[i].count("{") - lines[i].count("}")
                  if "{" in lines[i]: seen = True
                  if seen and depth == 0: en = i; break
              m = re.search(r'\(([^)]*)\)', lines[st])
              ps = [re.split(r'[\s*&]+', p.strip())[-1] for p in m.group(1).split(",")] if m else []
              if len(ps) < 2: continue
              s2 = f"(char*){ps[0]}, (char*)" + (ps[1] if "end" in ps[1].lower() else f"((char*){ps[0]} + {ps[1]})")
              head = lines[st].rstrip().rstrip("{").rstrip()
              lines[st:en + 1] = [head + " {", f"  __builtin___clear_cache({s2});", "}"]
              f.write_text("\n".join(lines)); print("patched", f)
          PY
          }
          for N in 1 10 30 60 100 200 400; do
            C=$(git -C Dobby rev-list --first-parent "$MAIN" | sed -n "${N}p")
            [ -n "$C" ] || { echo "=== Dobby: на глубине $N коммитов нет"; continue; }
            echo "=== Dobby: пробую $(git -C Dobby log -1 --format='%h %ad %s' --date=short "$C") (на $N назад)"
            for VAR in A B; do
              git -C Dobby checkout -q -f "$C"
              [ "$VAR" = B ] && patch_r7
              rm -rf Dobby/build
              if cmake -S Dobby -B Dobby/build \
                   -DCMAKE_TOOLCHAIN_FILE=$NDK/build/cmake/android.toolchain.cmake \
                   -DANDROID_ABI=armeabi-v7a -DANDROID_PLATFORM=android-21 -DANDROID_STL=c++_static \
                   -DANDROID_ARM_MODE=arm \
                   -DCMAKE_C_FLAGS="-fomit-frame-pointer" -DCMAKE_CXX_FLAGS="-fomit-frame-pointer" \
                   -DCMAKE_BUILD_TYPE=Release -DDOBBY_GENERATE_SHARED=OFF -DDOBBY_DEBUG=OFF \
                   -DCMAKE_POLICY_VERSION_MINIMUM=3.5 > dobby_try.log 2>&1 \
                 && cmake --build Dobby/build -j4 >> dobby_try.log 2>&1; then
                DOBBY_LIBS=$(find Dobby/build -name '*.a' | tr '\n' ' ')
                [ -n "$DOBBY_LIBS" ] && { echo "=== Dobby собран ($N назад, вариант $VAR): $DOBBY_LIBS"; break 2; }
              fi
              echo "=== Dobby не собрался ($N назад, вариант $VAR), ошибки:"
              grep -E "error|Error" dobby_try.log | head -n 8 || true
            done
          done
          [ -n "$DOBBY_LIBS" ] || { echo "=== Dobby не собрался ни на одной глубине"; exit 1; }

          # 1) libmggpanel.so (armeabi-v7a)
          CXX=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi21-clang++
          $CXX -std=c++17 -O2 -shared -fPIC -static-libstdc++ \
            -DMGG_HAS_DOBBY \
            -DMGG_TOKEN="\"$TOKEN\"" \
            -o libmggpanel.so mgg_panel.cpp -Wl,--start-group $DOBBY_LIBS -Wl,--end-group -llog
          file libmggpanel.so || true

          # 2) Java: overlay.jar (Overlay) и loader.dex (Loader)
          SDK=${ANDROID_HOME:-$ANDROID_SDK_ROOT}
          AJAR=$(ls -d "$SDK"/platforms/android-*/android.jar | sort -V | tail -1)
          BT=$(ls -d "$SDK"/build-tools/* | sort -V | tail -1)
          echo "android.jar: $AJAR, build-tools: $BT"
          mkdir -p build/src/mgg build/ov build/ld
          sed "s|__MGG_TOKEN__|$TOKEN|" mgg/Overlay.java > build/src/mgg/Overlay.java
          sed "s|__MGG_REPO__|$GITHUB_REPOSITORY|" mgg/Loader.java > build/src/mgg/Loader.java
          javac --release 8 -cp "$AJAR" -d build/ov build/src/mgg/Overlay.java
          javac --release 8 -cp "$AJAR" -d build/ld build/src/mgg/Loader.java
          "$BT/d8" --release --min-api 21 --lib "$AJAR" --output overlay.jar $(find build/ov -name '*.class')
          mkdir -p build/ldout
          "$BT/d8" --release --min-api 21 --lib "$AJAR" --output build/ldout $(find build/ld -name '*.class')
          cp build/ldout/classes.dex loader.dex

          echo "${GITHUB_SHA::7}-$GITHUB_RUN_NUMBER" > version.txt   # номер запуска: ручной перезапуск без правок тоже обновит игру
          ls -l libmggpanel.so overlay.jar loader.dex version.txt

      - uses: actions/upload-artifact@v4
        with:
          name: mgg-build
          path: |
            libmggpanel.so
            overlay.jar
            loader.dex
            version.txt

      - name: Publish release latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest libmggpanel.so overlay.jar loader.dex version.txt \
            --target "$GITHUB_SHA" --title "latest" --notes "build ${GITHUB_SHA::7}"
