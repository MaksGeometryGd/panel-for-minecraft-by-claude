# Положи как .github/workflows/build.yml. Рядом в репозитории: mgg_panel.cpp (корень), mgg/Overlay.java, mgg/FMenu.java, mgg/Loader.java.
# Каждый пуш собирает: libmggpanel.so (панель), overlay.jar (окно поверх игры), loader.dex (ставится в APK один раз)
# и выкладывает их в релиз "latest" с постоянными ссылками. Загрузчик в игре сам скачивает свежую сборку.
# Токен панели: Settings -> Secrets and variables -> Actions -> New secret -> MGG_TOKEN (буквы, цифры, _ и -). Нет секрета: токен "mgg".
name: Build MGG panel
on: [workflow_dispatch, push]
permissions:
  contents: write
concurrency:
  group: mgg-release
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        env:
          MGG_TOKEN: ${{ secrets.MGG_TOKEN }}
        run: |
          set -e
          TOKEN="${MGG_TOKEN:-mgg}"
          [[ "$TOKEN" =~ ^[A-Za-z0-9_-]+$ ]] || { echo "MGG_TOKEN: только буквы, цифры, _ и -"; exit 1; }

          # 0) Dobby (хуки). Его последняя версия не собирается под 32-бит, поэтому идём назад по истории
          #    (на 1, 30, 60... коммитов назад) и берём первую версию, которая собралась.
          # Что чиним (по логам прошлых запусков):
          #   - R7: сборка в ARM-режиме (ANDROID_ARM_MODE=arm) + -fomit-frame-pointer. Это уже работает, правка исходников не нужна;
          #   - android/log.h "function definition is not allowed here": в logging.c этот include стоит внутри функции,
          #     новый NDK кладёт в заголовок inline-функции. Переносим include в начало файла;
          #   - mach-o/loader.h: плагин SymbolResolver лез в macOS-код. Плагины выключаем, для хуков они не нужны;
          #   - core/arch/Cpu.h не найден: добавляем -I на папку, где этот файл реально лежит;
          #   - собираем только цель dobby, а не всё подряд (примеры, тесты);
          #   - пробуем старый NDK r25 (с ним Dobby 2022-2023 годов дружит лучше), потом новый.
          SDKROOT=${ANDROID_HOME:-$ANDROID_SDK_ROOT}
          if ! ls "$SDKROOT"/ndk 2>/dev/null | grep -q '^25\.'; then
            SM="$SDKROOT/cmdline-tools/latest/bin/sdkmanager"; [ -x "$SM" ] || SM=$(command -v sdkmanager || true)
            [ -n "$SM" ] && { yes | "$SM" --install "ndk;25.2.9519653" > /dev/null 2>&1 || echo "=== NDK r25 не поставился, идём дальше без него"; }
          fi
          NDK_LIST=""
          for D in "$SDKROOT"/ndk/25.* "${ANDROID_NDK_HOME:-}" "${ANDROID_NDK_LATEST_HOME:-}" "${ANDROID_NDK_ROOT:-}"; do
            [ -d "$D" ] || continue
            case " $NDK_LIST " in *" $D "*) ;; *) NDK_LIST="$NDK_LIST $D" ;; esac
          done
          echo "=== NDK для проб:$NDK_LIST"

          git clone https://github.com/jmpews/Dobby.git
          MAIN=$(git -C Dobby rev-parse HEAD)
          echo "=== Dobby: коммитов в истории: $(git -C Dobby rev-list --count "$MAIN"), теги: $(git -C Dobby tag | tail -n 5 | tr '\n' ' ')"

          fix_logging() {
            python3 - <<'PY'
          import re, pathlib
          for f in pathlib.Path("Dobby").rglob("logging.c*"):
              t = f.read_text(errors="ignore")
              if "android/log.h" not in t: continue
              t = re.sub(r'^[ \t]*#[ \t]*include[ \t]*<android/log\.h>[ \t]*\n', '', t, flags=re.M)
              f.write_text("#include <android/log.h>\n" + t); print("log.h перенесён наверх:", f)
          PY
          }

          NDK=""; DOBBY_LIBS=""
          for N in 1 30 60 100 200 400; do
            C=$(git -C Dobby rev-list --first-parent "$MAIN" | sed -n "${N}p")
            [ -n "$C" ] || { echo "=== Dobby: на глубине $N коммитов нет"; continue; }
            echo "=== Dobby: пробую $(git -C Dobby log -1 --format='%h %ad %s' --date=short "$C") (на $N назад)"
            for CAND in $NDK_LIST; do
              git -C Dobby checkout -q -f "$C"
              fix_logging
              CPU_H=$(find Dobby -path '*core/arch/Cpu.h' | head -n 1)
              INC=""; [ -n "$CPU_H" ] && INC="-I$(pwd)/${CPU_H%/core/arch/Cpu.h}"
              rm -rf Dobby/build
              if cmake -S Dobby -B Dobby/build \
                   -DCMAKE_TOOLCHAIN_FILE=$CAND/build/cmake/android.toolchain.cmake \
                   -DANDROID_ABI=armeabi-v7a -DANDROID_PLATFORM=android-21 -DANDROID_STL=c++_static \
                   -DANDROID_ARM_MODE=arm \
                   -DCMAKE_C_FLAGS="-fomit-frame-pointer $INC" -DCMAKE_CXX_FLAGS="-fomit-frame-pointer $INC" \
                   -DCMAKE_BUILD_TYPE=Release -DDOBBY_GENERATE_SHARED=OFF -DDOBBY_DEBUG=OFF \
                   -DPlugin.SymbolResolver=OFF -DPlugin.ImportTableReplace=OFF -DPlugin.Android.BionicLinkerUtil=OFF \
                   -DPlugin.ApplicationEventMonitor=OFF -DDOBBY_BUILD_EXAMPLE=OFF -DDOBBY_BUILD_TEST=OFF \
                   -DCMAKE_POLICY_VERSION_MINIMUM=3.5 > dobby_try.log 2>&1 \
                 && { cmake --build Dobby/build --target dobby -j4 >> dobby_try.log 2>&1 \
                      || cmake --build Dobby/build -j4 >> dobby_try.log 2>&1; }; then
                LIBS=$(find Dobby/build -name '*.a' | tr '\n' ' ')
                NM=$CAND/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm
                HAS=0; for L in $LIBS; do "$NM" "$L" 2>/dev/null | grep -qE ' T _?DobbyHook$' && HAS=1; done
                if [ -n "$LIBS" ] && [ "$HAS" = 1 ]; then
                  NDK=$CAND; DOBBY_LIBS=$LIBS
                  echo "=== Dobby собран ($N назад, $(basename "$CAND")): $DOBBY_LIBS"; break 2
                fi
                echo "=== Собралось, но символа DobbyHook в .a нет ($N назад, $(basename "$CAND")): $LIBS"
                continue
              fi
              echo "=== Dobby не собрался ($N назад, $(basename "$CAND")), ошибки:"
              # повторный проход в один поток, чтобы строки ошибок не перемешивались
              cmake --build Dobby/build -j1 -- -k > dobby_err.log 2>&1 || true
              cat dobby_try.log dobby_err.log | grep -E ' error:|fatal error:|\*\*\*|CMake Error|No such file|not found' | grep -v 'Werror' | sort -u | head -n 8 || true
            done
          done
          [ -n "$DOBBY_LIBS" ] || { echo "=== Dobby не собрался ни на одной глубине"; exit 1; }

          # 1) libmggpanel.so (armeabi-v7a)
          CXX=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi21-clang++
          $CXX -std=c++17 -O2 -shared -fPIC -static-libstdc++ \
            -DMGG_HAS_DOBBY \
            -DMGG_TOKEN="\"$TOKEN\"" \
            -o libmggpanel.so mgg_panel.cpp -Wl,--start-group $DOBBY_LIBS -Wl,--end-group -llog
          file libmggpanel.so || true

          # 2) Java: overlay.jar (Overlay) и loader.dex (Loader)
          SDK=${ANDROID_HOME:-$ANDROID_SDK_ROOT}
          AJAR=$(ls -d "$SDK"/platforms/android-*/android.jar | sort -V | tail -1)
          BT=$(ls -d "$SDK"/build-tools/* | sort -V | tail -1)
          echo "android.jar: $AJAR, build-tools: $BT"
          mkdir -p build/src/mgg build/ov build/ld
          sed "s|__MGG_TOKEN__|$TOKEN|" mgg/Overlay.java > build/src/mgg/Overlay.java
          sed "s|__MGG_REPO__|$GITHUB_REPOSITORY|" mgg/Loader.java > build/src/mgg/Loader.java
          cp mgg/FMenu.java build/src/mgg/FMenu.java
          javac --release 8 -cp "$AJAR" -d build/ov build/src/mgg/Overlay.java build/src/mgg/FMenu.java
          javac --release 8 -cp "$AJAR" -d build/ld build/src/mgg/Loader.java
          "$BT/d8" --release --min-api 21 --lib "$AJAR" --output overlay.jar $(find build/ov -name '*.class')
          mkdir -p build/ldout
          "$BT/d8" --release --min-api 21 --lib "$AJAR" --output build/ldout $(find build/ld -name '*.class')
          cp build/ldout/classes.dex loader.dex

          echo "${GITHUB_SHA::7}-$GITHUB_RUN_NUMBER" > version.txt   # номер запуска: ручной перезапуск без правок тоже обновит игру
          ls -l libmggpanel.so overlay.jar loader.dex version.txt

      - uses: actions/upload-artifact@v4
        with:
          name: mgg-build
          path: |
            libmggpanel.so
            overlay.jar
            loader.dex
            version.txt

      - name: Publish release latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest libmggpanel.so overlay.jar loader.dex version.txt \
            --target "$GITHUB_SHA" --title "latest" --notes "build ${GITHUB_SHA::7}"
